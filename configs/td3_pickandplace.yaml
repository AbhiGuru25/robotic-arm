# TD3 (no HER) on PandaPickAndPlace-v3
# Ablation baseline: sparse reward WITHOUT HER

algo:  td3
task:  pickandplace
her:   false

max_episode_steps: 50
total_timesteps:   1_000_000
learning_starts:   1_000
batch_size:        256
buffer_size:       1_000_000

actor_lr:           0.001
critic_lr:          0.001
gamma:              0.98
tau:                0.005
policy_delay:       2
policy_noise:       0.2
noise_clip:         0.5
exploration_noise:  0.1

hidden_sizes: [256, 256]
eval_freq:      5_000
eval_episodes:  20
seeds: [0, 1, 2]
